# Standard reverse-proxy headers. The backend runs with TRUST_PROXY=true.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  $server_port;
proxy_set_header X-Request-Id      $sem_request_id;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;
# NOTE: X-SSL-Client-* headers are set explicitly per location (conf.d) so that
# clients can never inject a client-certificate identity.

# SecureEndpoint Manager — Nginx main configuration (reverse proxy / TLS terminator)
# Site configuration: conf.d/secureendpoint.conf. Shared snippets: snippets/*.conf

worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 8192;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout 65s;
    keepalive_requests 1000;
    types_hash_max_size 4096;
    server_names_hash_bucket_size 128;

    # Body / buffer limits (report uploads, agent inventory payloads)
    client_max_body_size    20m;
    client_body_buffer_size 256k;
    client_header_timeout   30s;
    client_body_timeout     60s;
    send_timeout            60s;
    # Upstream defaults (locations may override, e.g. /api/ report downloads)
    proxy_connect_timeout   5s;
    proxy_send_timeout      60s;
    proxy_read_timeout      60s;
    large_client_header_buffers 4 16k;

    # Temp paths (root FS is read-only in the container; /var/cache/nginx is a tmpfs)
    client_body_temp_path /var/cache/nginx/client_temp;
    proxy_temp_path       /var/cache/nginx/proxy_temp;
    fastcgi_temp_path     /var/cache/nginx/fastcgi_temp;
    uwsgi_temp_path       /var/cache/nginx/uwsgi_temp;
    scgi_temp_path        /var/cache/nginx/scgi_temp;

    # Request ID: keep an incoming X-Request-Id (from an upstream LB) or mint one.
    map $http_x_request_id $sem_request_id {
        default $http_x_request_id;
        ""      $request_id;
    }

    # WebSocket upgrade support. Empty Connection header (not "close") keeps
    # upstream keep-alive working for normal requests.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      "";
    }

    # Structured access log (JSON) — ship with any log collector.
    log_format sem_json escape=json
        '{"time":"$time_iso8601","request_id":"$sem_request_id",'
        '"remote_addr":"$remote_addr","x_forwarded_for":"$http_x_forwarded_for",'
        '"method":"$request_method","uri":"$request_uri","status":$status,'
        '"bytes":$body_bytes_sent,"request_time":$request_time,'
        '"upstream":"$upstream_addr","upstream_status":"$upstream_status",'
        '"upstream_time":"$upstream_response_time","user_agent":"$http_user_agent",'
        '"host":"$host","tls":"$ssl_protocol","client_cert":"$ssl_client_verify"}';
    access_log /dev/stdout sem_json;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml application/rss+xml
        application/manifest+json image/svg+xml font/ttf font/otf;

    # Rate-limit zones (per client IP unless noted). Tune with traffic.
    limit_req_zone  $binary_remote_addr zone=sem_general:20m rate=30r/s;
    limit_req_zone  $binary_remote_addr zone=sem_api:20m     rate=20r/s;
    limit_req_zone  $binary_remote_addr zone=sem_auth:10m    rate=10r/m;
    # Agents are often behind NAT — key them per device instead of per IP.
    limit_req_zone  $http_x_device_id   zone=sem_agent:20m   rate=2r/s;
    limit_req_zone  $binary_remote_addr zone=sem_enroll:10m  rate=30r/m;
    limit_conn_zone $binary_remote_addr zone=sem_conn:20m;
    limit_req_status  429;
    limit_conn_status 429;

    # Upstream keep-alive
    proxy_http_version 1.1;
    proxy_buffering on;
    proxy_buffers 16 32k;
    proxy_buffer_size 32k;
    proxy_busy_buffers_size 64k;

    include /etc/nginx/conf.d/*.conf;
}

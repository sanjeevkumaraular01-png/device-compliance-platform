# =============================================================================
#  SecureEndpoint Manager — site configuration
#    /                 -> frontend:3000 (Next.js admin console)
#    /api/             -> backend:4000  (REST API, Swagger at /api/docs)
#    /api/v1/auth/     -> backend, strict rate limit
#    /api/v1/agent/    -> backend, per-device rate limit, optional mTLS
#    /downloads/       -> static agent binaries + install scripts (agent-dist volume)
#    /metrics          -> backend, internal networks only
# =============================================================================

# ----------------------------------------------------------------- HTTP :80
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Container healthcheck (plain HTTP; returns a static "ok", no information leak)
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ACME HTTP-01 challenges (certbot --webroot -w /var/www/certbot)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------- HTTPS :443
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    # --- TLS (Mozilla "intermediate" profile: TLS 1.2 + 1.3) -----------------
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_ecdh_curve X25519:prime256v1:secp384r1;
    ssl_session_cache shared:SEM_TLS:20m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # OCSP stapling (effective with a publicly trusted certificate; harmless otherwise)
    # ssl_stapling on;
    # ssl_stapling_verify on;
    # resolver 1.1.1.1 9.9.9.9 valid=300s;

    # --- Optional agent mTLS -------------------------------------------------
    # Agents receive a device certificate at enrollment, issued by the backend's
    # internal CA. To require it on /api/v1/agent/ (except /enroll):
    #   1. Export the CA:  curl -fsS https://DOMAIN/api/v1/enrollment/ca.pem \
    #                        -o deploy/nginx/certs/agent-ca.pem
    #   2. Uncomment the two lines below (they must live at server level).
    #   3. Uncomment the `if ($ssl_client_verify != SUCCESS)` block in the
    #      /api/v1/agent/ location, then `docker compose restart nginx`.
    # `optional` keeps the console and /enroll working without a client cert.
    # ssl_client_certificate /etc/nginx/certs/agent-ca.pem;
    # ssl_verify_client optional;
    # ssl_verify_depth 2;

    limit_conn sem_conn 100;

    # Re-resolved each request via the Docker resolver so container restarts don’t 502.
    set $sem_backend  backend:4000;
    set $sem_frontend frontend:3000;

    # --- Admin console (Next.js) -------------------------------------------
    location / {
        limit_req zone=sem_general burst=100 nodelay;
        include /etc/nginx/snippets/proxy-headers.conf;
        include /etc/nginx/snippets/security-headers.conf;
        proxy_set_header X-SSL-Client-Fingerprint "";
        proxy_set_header X-SSL-Client-Verify "";
        proxy_pass http://$sem_frontend$request_uri;
    }

    # Immutable, content-hashed build assets
    location ^~ /_next/static/ {
        include /etc/nginx/snippets/proxy-headers.conf;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        proxy_set_header X-SSL-Client-Fingerprint "";
        proxy_set_header X-SSL-Client-Verify "";
        proxy_hide_header Cache-Control;
        proxy_pass http://$sem_frontend$request_uri;
        access_log off;
    }

    # --- REST API ----------------------------------------------------------
    location /api/ {
        limit_req zone=sem_api burst=60 nodelay;
        include /etc/nginx/snippets/proxy-headers.conf;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        proxy_set_header X-SSL-Client-Fingerprint "";
        proxy_set_header X-SSL-Client-Verify "";
        # Report downloads / CSV exports can be large and slow to generate
        proxy_read_timeout 300s;
        proxy_pass http://$sem_backend$request_uri;
    }

    # Authentication endpoints: strict per-IP limit (login, MFA, refresh, SSO)
    location /api/v1/auth/ {
        limit_req zone=sem_auth burst=10 nodelay;
        include /etc/nginx/snippets/proxy-headers.conf;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        proxy_set_header X-SSL-Client-Fingerprint "";
        proxy_set_header X-SSL-Client-Verify "";
        proxy_pass http://$sem_backend$request_uri;
    }

    # Agent enrollment (no device identity yet): per-IP limit, no mTLS
    location = /api/v1/agent/enroll {
        limit_req zone=sem_enroll burst=20 nodelay;
        include /etc/nginx/snippets/proxy-headers.conf;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        proxy_set_header X-SSL-Client-Fingerprint "";
        proxy_set_header X-SSL-Client-Verify "";
        proxy_pass http://$sem_backend$request_uri;
    }

    # Agent protocol: per-device rate limit, forwards client-cert identity
    location /api/v1/agent/ {
        limit_req zone=sem_agent burst=30 nodelay;
        # --- Uncomment to ENFORCE mTLS (see server-level instructions) ---
        # if ($ssl_client_verify != SUCCESS) {
        #     return 403;
        # }
        include /etc/nginx/snippets/proxy-headers.conf;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        # SHA-1 fingerprint of the verified client certificate (empty without mTLS).
        proxy_set_header X-SSL-Client-Fingerprint $ssl_client_fingerprint;
        proxy_set_header X-SSL-Client-Verify      $ssl_client_verify;
        proxy_set_header X-SSL-Client-Serial      $ssl_client_serial;
        proxy_read_timeout 120s;
        proxy_pass http://$sem_backend$request_uri;
    }

    # Public CA certificate (install scripts fetch it)
    location = /api/v1/enrollment/ca.pem {
        include /etc/nginx/snippets/proxy-headers.conf;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        proxy_set_header X-SSL-Client-Fingerprint "";
        proxy_set_header X-SSL-Client-Verify "";
        proxy_hide_header Cache-Control;
        proxy_pass http://$sem_backend$request_uri;
    }

    # --- Prometheus metrics: never served publicly --------------------------
    # Prometheus scrapes backend:4000/metrics and worker:4000/metrics directly on
    # the internal network. An IP allow-list is not safe here: behind Docker's
    # userland proxy / Docker Desktop every client appears as 172.x.
    location = /metrics {
        access_log off;
        return 404;
    }

    # --- Agent binaries & install scripts (populated by agent-dist) --------
    location /downloads/ {
        alias /usr/share/nginx/downloads/;
        autoindex off;
        limit_req zone=sem_general burst=50 nodelay;
        include /etc/nginx/snippets/security-headers.conf;
        # File names are stable across versions -> short cache + revalidation.
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        types {
            application/octet-stream        exe bin;
            text/plain                      ps1 sh txt;
            application/x-apple-diskimage   dmg;
            application/pkcs7-signature     sig;
        }
        # Extension-less Linux/macOS binaries (sem-agent-linux-amd64 ...) fall
        # back to application/octet-stream.
        default_type application/octet-stream;
        etag on;
    }

    # Block dotfiles and common probes
    location ~ /\.(?!well-known/) {
        deny all;
        return 404;
    }
}

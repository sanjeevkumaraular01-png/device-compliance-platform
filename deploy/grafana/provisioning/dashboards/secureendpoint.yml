apiVersion: 1

providers:
  - name: SecureEndpoint
    orgId: 1
    folder: SecureEndpoint
    folderUid: secureendpoint
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false

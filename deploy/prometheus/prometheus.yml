# SecureEndpoint Manager — Prometheus configuration (docker compose, profile `monitoring`)
# On Kubernetes use the ServiceMonitor/PrometheusRule in deploy/k8s/components/prometheus-operator.
global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    product: secureendpoint
    environment: compose

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # NestJS API (APP_ROLE=api) — /metrics is served on the app port, not under /api/v1
  - job_name: backend-api
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:4000"]
        labels:
          app_role: api

  # BullMQ worker (APP_ROLE=worker) — still serves /health and /metrics on 4000
  - job_name: backend-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:4000"]
        labels:
          app_role: worker

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  # Optional (profile `node-exporter`, Linux hosts). Target is simply down otherwise.
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

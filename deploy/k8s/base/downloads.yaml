# Agent downloads: nginx (unprivileged) serving binaries + install scripts that the
# agent-dist initContainer copies into an emptyDir at pod start. Each rollout of a
# new agent-dist image tag refreshes the files.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sem-downloads
  labels:
    app.kubernetes.io/name: sem-downloads
    app.kubernetes.io/component: downloads
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: sem-downloads
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sem-downloads
        app.kubernetes.io/component: downloads
    spec:
      serviceAccountName: sem-app
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: sem-downloads
      initContainers:
        - name: agent-dist
          image: ghcr.io/secureendpoint/secureendpoint-manager/agent-dist
          imagePullPolicy: IfNotPresent
          # Image entrypoint copies /downloads/* to /out and exits.
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: downloads
              mountPath: /out
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: downloads
              mountPath: /srv/downloads
              readOnly: true
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: downloads
          emptyDir:
            sizeLimit: 1Gi
        - name: nginx-conf
          configMap:
            name: sem-downloads-nginx
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: sem-downloads
  labels:
    app.kubernetes.io/name: sem-downloads
    app.kubernetes.io/component: downloads
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: sem-downloads
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sem-downloads
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sem-downloads

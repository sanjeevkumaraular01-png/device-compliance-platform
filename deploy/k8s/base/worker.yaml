# Backend worker (APP_ROLE=worker): BullMQ processors (compliance, reports, alerts,
# maintenance) and schedulers. Serves /api/v1/health and /metrics on 4000.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sem-worker
  labels:
    app.kubernetes.io/name: sem-worker
    app.kubernetes.io/component: worker
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: sem-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sem-worker
        app.kubernetes.io/component: worker
        sem.io/db-client: "true"
    spec:
      serviceAccountName: sem-app
      automountServiceAccountToken: false
      # Let in-flight jobs (report generation) finish.
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: sem-worker
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: sem-worker
      containers:
        - name: worker
          image: ghcr.io/secureendpoint/secureendpoint-manager/backend
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: sem-config
            - secretRef:
                name: sem-secrets
          env:
            - name: APP_ROLE
              value: worker
            - name: RUN_MIGRATIONS
              value: "false"
            - name: RUN_SEED
              value: "false"
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 4
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: sem-data
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
---
# Headless service used only for Prometheus scraping of the workers.
apiVersion: v1
kind: Service
metadata:
  name: sem-worker-metrics
  labels:
    app.kubernetes.io/name: sem-worker
    app.kubernetes.io/component: worker
    sem.io/metrics: "true"
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: sem-worker
  ports:
    - name: http
      port: 4000
      targetPort: http
      protocol: TCP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sem-worker
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sem-worker
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sem-worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sem-worker
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600

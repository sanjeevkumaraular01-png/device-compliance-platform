# nginx-unprivileged server for agent binaries (populated by the agent-dist initContainer)
server {
    listen 8080;
    server_name _;
    server_tokens off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /downloads/ {
        alias /srv/downloads/;
        autoindex off;
        etag on;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        types {
            application/octet-stream exe bin;
            text/plain               ps1 sh txt;
        }
        default_type application/octet-stream;
    }

    location / {
        return 404;
    }
}

# =============================================================================
#  TEMPLATE ONLY — never commit real values. NOT referenced by kustomization.yaml.
# =============================================================================
#  Create the real Secret out of band, for example:
#
#    kubectl -n secureendpoint create secret generic sem-secrets \
#      --from-literal=DATABASE_URL='postgresql://sem:...@pg.example.com:5432/secureendpoint?schema=public&sslmode=require' \
#      --from-literal=REDIS_URL='rediss://:...@redis.example.com:6380/0' \
#      --from-literal=JWT_ACCESS_SECRET="$(openssl rand -base64 48)" \
#      --from-literal=ENCRYPTION_KEY="$(openssl rand -base64 32)" \
#      --from-literal=SEED_ADMIN_PASSWORD='...' ...
#
#  Preferred in production (GitOps-safe):
#    * External Secrets Operator — sync from AWS Secrets Manager / Azure Key Vault /
#      GCP Secret Manager / HashiCorp Vault. See ../examples/external-secret.yaml.
#    * Sealed Secrets — `kubeseal --format yaml < secret.yaml > sealed-secret.yaml`
#      and commit only the SealedSecret.
#
#  ENCRYPTION_KEY must stay identical across all replicas and across upgrades;
#  changing it makes encrypted columns unreadable (see docs/RUNBOOK.md).
apiVersion: v1
kind: Secret
metadata:
  name: sem-secrets
  namespace: secureendpoint
type: Opaque
stringData:
  DATABASE_URL: "postgresql://sem:CHANGE_ME@postgres:5432/secureendpoint?schema=public"
  REDIS_URL: "redis://:CHANGE_ME@redis:6379/0"
  JWT_ACCESS_SECRET: "CHANGE_ME_openssl_rand_base64_48"
  ENCRYPTION_KEY: "CHANGE_ME_openssl_rand_base64_32"
  SEED_ADMIN_PASSWORD: "CHANGE_ME"
  SMTP_USER: ""
  SMTP_PASSWORD: ""
  TWILIO_ACCOUNT_SID: ""
  TWILIO_AUTH_TOKEN: ""
  LDAP_BIND_PASSWORD: ""
  AZURE_AD_CLIENT_SECRET: ""
  OIDC_CLIENT_SECRET: ""
  # Only when using the optional in-cluster StatefulSets (deploy/k8s/postgres, deploy/k8s/redis):
  POSTGRES_PASSWORD: "CHANGE_ME"
  REDIS_PASSWORD: "CHANGE_ME"

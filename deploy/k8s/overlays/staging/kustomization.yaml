# Staging: smaller footprint, in-cluster PostgreSQL + Redis, demo data seeded,
# Let's Encrypt staging issuer.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: secureendpoint-staging

resources:
  - ../../base
  - ../../postgres
  - ../../redis

components:
  - ../../components/prometheus-operator

labels:
  - pairs:
      app.kubernetes.io/instance: secureendpoint-staging
      sem.io/environment: staging
    includeSelectors: false

images:
  - name: ghcr.io/secureendpoint/secureendpoint-manager/backend
    newTag: main
  - name: ghcr.io/secureendpoint/secureendpoint-manager/frontend
    newTag: main
  - name: ghcr.io/secureendpoint/secureendpoint-manager/agent-dist
    newTag: main

replicas:
  - name: sem-api
    count: 2
  - name: sem-worker
    count: 1
  - name: sem-frontend
    count: 1
  - name: sem-downloads
    count: 1

configMapGenerator:
  - name: sem-config
    behavior: merge
    options:
      labels:
        app.kubernetes.io/component: config
    literals:
      - LOG_LEVEL=debug
      - CORS_ORIGINS=https://staging.sem.example.com
      - WEB_URL=https://staging.sem.example.com
      - API_PUBLIC_URL=https://staging.sem.example.com/api/v1
      - AGENT_DOWNLOAD_BASE_URL=https://staging.sem.example.com/downloads
      - AZURE_AD_REDIRECT_URI=https://staging.sem.example.com/api/v1/auth/sso/azure-ad/callback
      - OIDC_REDIRECT_URI=https://staging.sem.example.com/api/v1/auth/sso/oidc/callback
      - SEED_DEMO_DATA=true

patches:
  # Namespace object name follows the overlay namespace
  - target:
      kind: Namespace
    patch: |-
      - op: replace
        path: /metadata/name
        value: secureendpoint-staging
  # Hostname + header ConfigMap namespace on every Ingress
  - target:
      kind: Ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: staging.sem.example.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: staging.sem.example.com
      - op: add
        path: /metadata/annotations/nginx.ingress.kubernetes.io~1custom-headers
        value: secureendpoint-staging/sem-security-headers
  - target:
      kind: Ingress
      name: sem-web
    patch: |-
      - op: replace
        path: /metadata/annotations/cert-manager.io~1cluster-issuer
        value: letsencrypt-staging
  # Lower HPA floors to match the replica counts
  - target:
      kind: HorizontalPodAutoscaler
      name: sem-api
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 4
  - target:
      kind: HorizontalPodAutoscaler
      name: sem-worker
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 3
  - target:
      kind: HorizontalPodAutoscaler
      name: sem-frontend
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 3
  # RWX storage class (example: NFS provisioner / Longhorn in the staging cluster)
  - target:
      kind: PersistentVolumeClaim
      name: sem-data
    patch: |-
      - op: add
        path: /spec/storageClassName
        value: nfs-client
      - op: replace
        path: /spec/resources/requests/storage
        value: 10Gi

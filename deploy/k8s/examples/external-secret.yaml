# External Secrets Operator example: materialises `sem-secrets` from a cloud
# secret store. Requires ESO and a (Cluster)SecretStore named `sem-secret-store`.
# Store one JSON secret `secureendpoint/production` with the keys listed in
# deploy/k8s/base/secret.example.yaml.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: sem-secrets
  namespace: secureendpoint
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: sem-secret-store
  target:
    name: sem-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: secureendpoint/production

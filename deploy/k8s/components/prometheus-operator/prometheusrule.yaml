# GENERATED by scripts/sync-prometheusrule.sh from deploy/prometheus/alerts.yml — do not edit.
# The `release` label must match your kube-prometheus-stack ruleSelector.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: secureendpoint
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: secureendpoint.availability
      rules:
        - alert: SemApiDown
          expr: (sum(up{app_role="api"}) or vector(0)) == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: SecureEndpoint API is down
            description: No backend API instance (APP_ROLE=api) has been scrapeable for 2 minutes. Console and agent check-ins are failing.
            runbook_url: https://github.com/secureendpoint/secureendpoint-manager/blob/main/docs/RUNBOOK.md#api-down
        - alert: SemApiInstanceDown
          expr: up{app_role="api"} == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "API instance {{ $labels.instance }} is down"
            description: "Instance {{ $labels.instance }} has been unreachable for 5 minutes; remaining replicas are serving traffic."
        - alert: SemWorkerDown
          expr: (sum(up{app_role="worker"}) or vector(0)) == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: SecureEndpoint worker is down
            description: No worker instance is up. Compliance evaluations, alert delivery and report generation are stalled.
        - alert: SemPostgresDown
          expr: (max(pg_up) or vector(0)) == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: PostgreSQL is down
            description: postgres-exporter reports pg_up == 0 (or no exporter data) for 1 minute.
        - alert: SemRedisDown
          expr: (max(redis_up) or vector(0)) == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: Redis is down
            description: redis-exporter reports redis_up == 0 (or no exporter data). BullMQ queues and rate limiting are unavailable.
    - name: secureendpoint.api
      rules:
        - alert: SemHighErrorRate
          expr: |
            sum(rate(sem_http_requests_total{status=~"5.."}[5m]))
              / sum(rate(sem_http_requests_total[5m])) > 0.05
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: API 5xx error rate above 5%
            description: "{{ $value | humanizePercentage }} of API requests returned 5xx over the last 5 minutes."
        - alert: SemHighLatencyP95
          expr: |
            histogram_quantile(0.95, sum by (le) (rate(sem_http_request_duration_seconds_bucket[5m]))) > 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: API p95 latency above 1s
            description: "p95 request latency is {{ $value | humanizeDuration }}."
        - alert: SemEventLoopLag
          expr: max by (instance) (nodejs_eventloop_lag_p99_seconds) > 0.5
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Node.js event loop lag high on {{ $labels.instance }}"
            description: "p99 event-loop lag is {{ $value | humanizeDuration }}; the process is CPU bound or blocked."
        - alert: SemLoginFailureSpike
          expr: sum(increase(sem_login_attempts_total{result!~"(?i)success.*"}[10m])) > 50
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: Spike in failed logins
            description: "{{ $value | humanize }} failed login attempts in 10 minutes — possible password spraying. Review /audit/login-history."
    - name: secureendpoint.queues
      rules:
        - alert: SemQueueBacklog
          expr: max by (queue) (sem_queue_jobs{state=~"waiting|wait|delayed"}) > 500
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Queue {{ $labels.queue }} backlog"
            description: "{{ $value }} jobs waiting in queue {{ $labels.queue }} for 15 minutes. Scale the worker or check for a stuck processor."
        - alert: SemQueueFailedJobs
          expr: max by (queue) (sem_queue_jobs{state="failed"}) > 50
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Failed jobs accumulating in {{ $labels.queue }}"
            description: "{{ $value }} failed jobs in queue {{ $labels.queue }}."
        - alert: SemAlertDeliveryFailures
          expr: sum by (channel) (increase(sem_alerts_sent_total{status=~"(?i)fail.*"}[15m])) > 5
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "Alert deliveries failing on channel {{ $labels.channel }}"
            description: "{{ $value | humanize }} failed deliveries in 15 minutes. Check channel configuration / SMTP / Twilio credentials."
    - name: secureendpoint.compliance
      rules:
        - alert: SemComplianceRateLow
          expr: |
            (
              max(sem_devices_compliance{state="COMPLIANT"})
                / sum(max by (state) (sem_devices_compliance))
            ) < 0.80
            and sum(max by (state) (sem_devices_compliance)) > 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: Fleet compliance rate below 80%
            description: "Only {{ $value | humanizePercentage }} of devices are COMPLIANT."
        - alert: SemCriticalRiskDevices
          expr: max(sem_devices_risk{risk_level="CRITICAL"}) > 0
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: Devices at CRITICAL risk for over 1 hour
            description: "{{ $value }} device(s) have been at CRITICAL risk for 1h (e.g. disk encryption or antivirus missing, unmanaged device). See docs/RUNBOOK.md#critical-alert."
            runbook_url: https://github.com/secureendpoint/secureendpoint-manager/blob/main/docs/RUNBOOK.md#critical-alert
        - alert: SemUsbBlockSpike
          expr: sum(increase(sem_usb_blocked_total[15m])) > 25
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: Many USB storage blocks
            description: "{{ $value | humanize }} USB storage devices blocked in 15 minutes — possible data-exfiltration attempt or a misconfigured whitelist."
        - alert: SemSoftwareViolationsHigh
          expr: max(sem_software_violations) > 50
          for: 1h
          labels:
            severity: info
          annotations:
            summary: High number of unauthorized/blacklisted software installs
            description: "{{ $value }} unauthorized or blacklisted software installations are present."
        - alert: SemAgentCheckinsStalled
          expr: |
            sum(rate(sem_agent_checkins_total[15m])) == 0
            and sum(max by (platform) (sem_devices_total)) > 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: No agent check-ins for 15 minutes
            description: Devices are enrolled but no agent heartbeat has been received for 15 minutes. Check ingress/TLS, DNS, the /api/v1/agent/ route and certificate validity.
        - alert: SemOnlineDevicesDrop
          expr: |
            max(sem_devices_online) < 0.5 * max(max_over_time(sem_devices_online[1d] offset 1h))
            and max(max_over_time(sem_devices_online[1d] offset 1h)) > 20
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: Online devices dropped by more than 50%
            description: "Only {{ $value }} devices online compared to the previous day's peak."

# =============================================================================
#  SecureEndpoint Manager — production-like Docker Compose stack
# =============================================================================
#  Core stack:        docker compose up -d
#  With monitoring:   docker compose --profile monitoring up -d
#  Local dev extras:  docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
#  All configuration comes from `.env` (see .env.example / docs/ENVIRONMENT.md).
#
#  Networks
#    frontend-net   nginx <-> frontend / backend          (published ports live here)
#    backend-net    frontend / backend / worker / prometheus (egress for SMTP, SSO, webhooks)
#    data-net       backend / worker / exporters -> postgres / redis   (internal, no egress)
#    monitoring-net prometheus / grafana / alertmanager / exporters
# =============================================================================
name: ${COMPOSE_PROJECT_NAME:-secureendpoint}

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"
    tag: "{{.Name}}"

x-hardening: &hardening
  restart: unless-stopped
  logging: *logging
  security_opt:
    - no-new-privileges:true

x-backend-build: &backend-build
  context: ./backend
  dockerfile: Dockerfile

# Environment shared by the api and the worker. Values come from .env; the
# connection strings are derived from the compose-managed postgres/redis unless
# DATABASE_URL / REDIS_URL are set explicitly (external / managed services).
x-backend-env: &backend-env
  NODE_ENV: ${NODE_ENV:-production}
  PORT: "4000"
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-sem}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-secureendpoint}?schema=public}
  REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/0}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET must be set (>= 32 chars)}
  JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-900}
  REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-7}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set (base64 of 32 bytes)}
  CORS_ORIGINS: ${CORS_ORIGINS:-https://localhost}
  WEB_URL: ${WEB_URL:-https://localhost}
  API_PUBLIC_URL: ${API_PUBLIC_URL:-https://localhost/api/v1}
  TRUST_PROXY: ${TRUST_PROXY:-true}
  RATE_LIMIT_TTL: ${RATE_LIMIT_TTL:-60}
  RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-300}
  AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-10}
  SECURITY_MFA_REQUIRED_ROLES: ${SECURITY_MFA_REQUIRED_ROLES:-SUPER_ADMIN,SECURITY_ADMIN}
  SESSION_IDLE_TIMEOUT_MINUTES: ${SESSION_IDLE_TIMEOUT_MINUTES:-30}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-}
  TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
  TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
  TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
  TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-}
  LDAP_URL: ${LDAP_URL:-}
  LDAP_BIND_DN: ${LDAP_BIND_DN:-}
  LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:-}
  LDAP_SEARCH_BASE: ${LDAP_SEARCH_BASE:-}
  LDAP_SEARCH_FILTER: ${LDAP_SEARCH_FILTER:-}
  LDAP_TLS_REJECT_UNAUTHORIZED: ${LDAP_TLS_REJECT_UNAUTHORIZED:-true}
  LDAP_DEFAULT_ROLE: ${LDAP_DEFAULT_ROLE:-EMPLOYEE}
  LDAP_GROUP_ROLE_MAP: ${LDAP_GROUP_ROLE_MAP:-{}}
  AZURE_AD_TENANT_ID: ${AZURE_AD_TENANT_ID:-}
  AZURE_AD_CLIENT_ID: ${AZURE_AD_CLIENT_ID:-}
  AZURE_AD_CLIENT_SECRET: ${AZURE_AD_CLIENT_SECRET:-}
  AZURE_AD_REDIRECT_URI: ${AZURE_AD_REDIRECT_URI:-}
  AZURE_AD_GROUP_ROLE_MAP: ${AZURE_AD_GROUP_ROLE_MAP:-{}}
  OIDC_ISSUER: ${OIDC_ISSUER:-}
  OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
  OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
  OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
  REPORTS_DIR: ${REPORTS_DIR:-/data/reports}
  CA_CERT_PATH: ${CA_CERT_PATH:-/data/pki/ca.crt}
  CA_KEY_PATH: ${CA_KEY_PATH:-/data/pki/ca.key}
  AGENT_DOWNLOAD_BASE_URL: ${AGENT_DOWNLOAD_BASE_URL:-https://localhost/downloads}
  SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@secureendpoint.local}
  SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-ChangeMe!Secure2026}
  SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
  DEMO_ACTIVITY: ${DEMO_ACTIVITY:-}
  # Workforce / AI work intelligence (docs/WORKFORCE.md) — all optional
  SCREENSHOTS_DIR: ${SCREENSHOTS_DIR:-/data/screenshots}
  WORKFORCE_TIMEZONE: ${WORKFORCE_TIMEZONE:-Asia/Kolkata}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  AI_MODEL: ${AI_MODEL:-claude-opus-5}
  AI_EFFORT: ${AI_EFFORT:-high}
  AI_DAILY_RUN_TIME: ${AI_DAILY_RUN_TIME:-20:30}
  AI_MAX_EMPLOYEES_PER_RUN: ${AI_MAX_EMPLOYEES_PER_RUN:-500}

x-node-healthcheck: &node-healthcheck
  test:
    - CMD
    - node
    - -e
    - "fetch('http://127.0.0.1:4000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
  interval: 15s
  timeout: 5s
  retries: 5
  start_period: 60s

services:
  # ---------------------------------------------------------------- data tier
  postgres:
    <<: *hardening
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sem}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-secureendpoint}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --data-checksums"
      PGDATA: /var/lib/postgresql/data/pgdata
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - work_mem=8MB
      - -c
      - wal_buffers=16MB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - min_wal_size=1GB
      - -c
      - max_wal_size=4GB
      - -c
      - log_min_duration_statement=1000
      - -c
      - password_encryption=scram-sha-256
    shm_size: 256mb
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [data-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 2G }
        reservations: { memory: 512M }

  redis:
    <<: *hardening
    image: redis:7-alpine
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 768mb
      # BullMQ requires noeviction so queued jobs are never silently dropped.
      - --maxmemory-policy
      - noeviction
      - --save
      - "900 1 300 100"
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    read_only: true
    volumes:
      - redis-data:/data
    networks: [data-net]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 6
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }

  # ---------------------------------------------------------------- app tier
  backend:
    <<: *hardening
    image: ${IMAGE_REGISTRY:-ghcr.io/secureendpoint/secureendpoint-manager}/backend:${IMAGE_TAG:-latest}
    build: *backend-build
    environment:
      <<: *backend-env
      APP_ROLE: api
      RUN_MIGRATIONS: "true"
      RUN_SEED: "true"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - app-data:/data
    networks: [frontend-net, backend-net, data-net]
    healthcheck: *node-healthcheck
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 1536M }
        reservations: { memory: 256M }

  worker:
    <<: *hardening
    image: ${IMAGE_REGISTRY:-ghcr.io/secureendpoint/secureendpoint-manager}/backend:${IMAGE_TAG:-latest}
    build: *backend-build
    environment:
      <<: *backend-env
      APP_ROLE: worker
      RUN_MIGRATIONS: "false"
      RUN_SEED: "false"
    depends_on:
      # Wait for the api so migrations have been applied before the worker starts.
      backend: { condition: service_healthy }
      redis: { condition: service_healthy }
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - app-data:/data
    networks: [backend-net, data-net]
    healthcheck: *node-healthcheck
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 2G }
        reservations: { memory: 256M }

  frontend:
    <<: *hardening
    image: ${IMAGE_REGISTRY:-ghcr.io/secureendpoint/secureendpoint-manager}/frontend:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        API_INTERNAL_URL: http://backend:4000
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      backend: { condition: service_healthy }
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    networks: [frontend-net, backend-net]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/',{redirect:'manual'}).then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 768M }

  # One-shot: copies agent binaries + install scripts into the `downloads` volume.
  agent-dist:
    image: ${IMAGE_REGISTRY:-ghcr.io/secureendpoint/secureendpoint-manager}/agent-dist:${IMAGE_TAG:-latest}
    build:
      context: ./agent
      dockerfile: Dockerfile
    restart: "no"
    logging: *logging
    security_opt:
      - no-new-privileges:true
    network_mode: none
    volumes:
      - downloads:/out
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 128M }

  nginx:
    <<: *hardening
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    depends_on:
      frontend: { condition: service_healthy }
      backend: { condition: service_healthy }
      agent-dist: { condition: service_completed_successfully }
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./deploy/nginx/snippets:/etc/nginx/snippets:ro
      - ${TLS_CERT_DIR:-./deploy/nginx/certs}:/etc/nginx/certs:ro
      - downloads:/usr/share/nginx/downloads:ro
    networks: [frontend-net]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 256M }

  # ---------------------------------------------------------------- monitoring (profile)
  prometheus:
    <<: *hardening
    profiles: [monitoring]
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    ports:
      - "${MONITORING_BIND:-127.0.0.1}:9090:9090"
    read_only: true
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    networks: [backend-net, monitoring-net]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }

  alertmanager:
    <<: *hardening
    profiles: [monitoring]
    image: prom/alertmanager:v0.27.0
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "${MONITORING_BIND:-127.0.0.1}:9093:9093"
    read_only: true
    volumes:
      - ./deploy/prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    networks: [monitoring-net]
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 128M }

  grafana:
    <<: *hardening
    profiles: [monitoring]
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SECURITY_COOKIE_SECURE: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
    ports:
      - "${MONITORING_BIND:-127.0.0.1}:${GRAFANA_PORT:-3001}:3000"
    depends_on:
      prometheus: { condition: service_healthy }
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks: [monitoring-net]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512M }

  postgres-exporter:
    <<: *hardening
    profiles: [monitoring]
    image: quay.io/prometheuscommunity/postgres-exporter:v0.16.0
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-sem}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-secureendpoint}?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }
    read_only: true
    networks: [data-net, monitoring-net]
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 128M }

  redis-exporter:
    <<: *hardening
    profiles: [monitoring]
    image: oliver006/redis_exporter:v1.66.0
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      redis: { condition: service_healthy }
    read_only: true
    networks: [data-net, monitoring-net]
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 64M }

  # Host metrics — Linux hosts only (bind-mounts the host root filesystem).
  # Enable with: docker compose --profile monitoring --profile node-exporter up -d
  node-exporter:
    <<: *hardening
    profiles: [node-exporter]
    image: prom/node-exporter:v1.8.2
    command:
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    pid: host
    read_only: true
    volumes:
      - /:/host:ro,rslave
    networks: [monitoring-net]
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 64M }

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge
  data-net:
    driver: bridge
    internal: true
  monitoring-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  # Shared by api + worker: generated reports and the internal device CA (/data/pki). BACK UP.
  app-data:
  # Agent binaries and install scripts served at https://DOMAIN/downloads/
  downloads:
  prometheus-data:
  alertmanager-data:
  grafana-data:

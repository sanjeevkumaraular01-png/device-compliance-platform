name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------ images
  images:
    name: Image ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write        # cosign keyless (Sigstore / Fulcio OIDC)
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: backend
            context: backend
            build-args: ""
          - image: frontend
            context: frontend
            build-args: API_INTERNAL_URL=http://backend:4000
          - image: agent-dist
            context: agent
            build-args: ""
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Image name (GHCR requires lowercase)
        id: name
        env:
          REPO: ${{ github.repository }}
          IMAGE: ${{ matrix.image }}
        run: echo "image=ghcr.io/${REPO,,}/${IMAGE}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=secureendpoint-${{ matrix.image }}
            org.opencontainers.image.vendor=SecureEndpoint
            org.opencontainers.image.licenses=LicenseRef-Proprietary

      # 1) Build amd64 locally and gate on Trivy BEFORE anything is pushed.
      - name: Build for scanning
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          build-args: ${{ matrix.build-args }}
          platforms: linux/amd64
          load: true
          push: false
          tags: scan/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=release-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.image }}

      - name: Trivy image scan (fail on CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: scan/${{ matrix.image }}:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: "1"
          format: table

      # 2) Multi-arch build + push with SBOM and SLSA provenance.
      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          build-args: ${{ matrix.build-args }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=release-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.image }}

      - uses: sigstore/cosign-installer@v3

      - name: Cosign keyless sign
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: GitHub build provenance attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # ------------------------------------------------------------------ GitHub release
  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: images
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract agent binaries from the agent-dist image
        run: |
          set -euo pipefail
          docker build -t sem-agent-dist:release ./agent
          mkdir -p out
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/out:/out" sem-agent-dist:release
          ls -la out
          (cd out && sha256sum -c checksums.txt)

      - uses: sigstore/cosign-installer@v3

      - name: Sign release artifacts (keyless)
        run: |
          set -euo pipefail
          cd out
          for f in sem-agent-* install.ps1 install.sh install-macos.sh checksums.txt; do
            [ -f "$f" ] || continue
            cosign sign-blob --yes --bundle "${f}.sigstore.json" "$f" > /dev/null
          done

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            out/sem-agent-*
            out/install.ps1
            out/install.sh
            out/install-macos.sh
            out/checksums.txt
            out/*.sigstore.json
